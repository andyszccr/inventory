<main class="gate">
  <section class="panel">
    <h1>Inventario</h1>
    <p>Entra para ver roles, categorías, productos, movimientos y usuarios.</p>
    <form [formGroup]="form" (ngSubmit)="enter()">
      <label class="field">
        Correo
        <input type="email" formControlName="email" autocomplete="username" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="field-error">Escribe un correo válido.</span>
        }
      </label>
      <label class="field">
        Contraseña
        <input type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="field-error">Falta la contraseña.</span>
        }
      </label>
      @if (loginError()) {
        <p class="field-error">{{ loginError() }}</p>
      }
      <button type="submit" [disabled]="loggingIn()">
        {{ loggingIn() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </section>
</main>
