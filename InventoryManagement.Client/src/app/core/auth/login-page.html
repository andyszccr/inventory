<main class="gate">
  <section class="panel">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <path
            d="M12 3 3 8l9 5 9-5-9-5Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
          <path
            d="M3 8v8l9 5 9-5V8"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
          <path d="M12 13v8" fill="none" stroke="currentColor" stroke-width="1.7" />
        </svg>
      </span>
      <h1>Inventario</h1>
      <p>Entra para ver roles, categorías, productos, movimientos y usuarios.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="enter()">
      <label class="field">
        Correo
        <span class="control">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect
              x="3.5"
              y="5.5"
              width="17"
              height="13"
              rx="1.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            />
            <path
              d="m4 7 8 6 8-6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linejoin="round"
            />
          </svg>
          <input type="email" formControlName="email" autocomplete="username" />
        </span>
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="field-error">Escribe un correo válido.</span>
        }
      </label>

      <label class="field">
        Contraseña
        <span class="control">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect
              x="5"
              y="10.5"
              width="14"
              height="9"
              rx="1.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            />
            <path
              d="M8 10.5V8a4 4 0 0 1 8 0v2.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            />
          </svg>
          <input type="password" formControlName="password" autocomplete="current-password" />
        </span>
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="field-error">Falta la contraseña.</span>
        }
      </label>

      @if (loginError()) {
        <p class="field-error">{{ loginError() }}</p>
      }

      <button type="submit" [disabled]="loggingIn()">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path
            d="M10 7H6.5A1.5 1.5 0 0 0 5 8.5v7A1.5 1.5 0 0 0 6.5 17H10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
          <path
            d="M11 12h8M16 8.5 19.5 12 16 15.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        {{ loggingIn() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </section>
</main>
